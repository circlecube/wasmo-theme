# CI for wasmo-theme — quality gates on every PR and push to main.
#
# Jobs:
#   changes    — detect which paths changed; gates the jobs below
#   php-syntax — php -l on all tracked .php files
#   php-lint   — PHPCS (WordPress Coding Standards) on includes/
#   js-lint    — ESLint + Stylelint via @wordpress/scripts
#   build      — npm ci + version alignment + npm run build + verify output
#   phpunit    — composer install (with dev) + PHPUnit + coverage report
#   wpunit     — wordpress-tests-lib + WP_UnitTestCase integration tests
#   audit      — npm audit + composer audit
#
# NOTE: This is intentionally inline rather than calling the reusable-theme-ci.yml from
# circlecube/bandiverse, because wasmo's build produces build/index.js (via @wordpress/scripts)
# not build/theme.css (the bandiverse build system). Staying inline avoids a false failure
# on the output verify step.
#
# NOTE: php-lint runs with continue-on-error: true until legacy includes/ files are
# brought into compliance. Remove that flag once phpcs reports zero violations.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      php: ${{ steps.filter.outputs.php }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            php:
              - '**/*.php'
              - 'composer.json'
              - 'composer.lock'
              - 'phpunit.xml.dist'
              - 'phpcs.xml.dist'
              - 'tests/**'
              - 'bin/**'
            node:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'webpack.config.js'
              - 'style.css'
              - 'scripts/**'

  php-syntax:
    name: PHP syntax
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Syntax check all tracked .php files
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.php' | grep -v '^vendor/' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files to check."
            exit 0
          fi
          echo "Checking ${#files[@]} PHP file(s)…"
          for f in "${files[@]}"; do php -l "$f"; done
          echo "All files passed."

  php-lint:
    name: PHP lint (PHPCS)
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    # continue-on-error until legacy includes/ files are WPCS-compliant
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPCS
        run: composer lint

  js-lint:
    name: JS & CSS lint
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    # continue-on-error until existing src/ files are lint-clean
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Lint CSS/SCSS
        run: npm run lint:css

  build:
    name: Node build & version check
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate version alignment
        run: node scripts/validate-theme-version.mjs

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f build/index.js

  phpunit:
    name: PHPUnit (with coverage)
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: pcov

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  wpunit:
    name: WP integration tests
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: mysqli

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist

      - name: Install WordPress test library
        run: composer setup:wpunit

      - name: Run WP integration tests
        run: composer test:wpunit

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: npm audit
        run: npm audit --audit-level=critical

      - name: composer audit
        run: |
          composer install --no-progress --prefer-dist --quiet
          composer audit
