# Playwright end-to-end smoke tests using @wordpress/env (Docker).
#
# Spins up a local WordPress install via wp-env, activates wasmo-theme,
# then runs Playwright against http://localhost:8888.
#
# Runs on:
#   - workflow_dispatch (manual trigger)
#   - pull_request when theme source or template files change
#
# Note: Requires Docker on the runner (ubuntu-latest supports this).

name: E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - '*.php'
      - 'template-parts/**'
      - 'blocks/**'
      - 'patterns/**'
      - 'style.css'
      - 'theme.json'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - '.wp-env.json'

permissions: {}

jobs:

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build theme assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npx wp-env start
        timeout-minutes: 5

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
